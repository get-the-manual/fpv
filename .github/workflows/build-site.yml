name: Build site

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: git-revision-date-localized reads page dates from it.
          fetch-depth: 0
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      # Zensical is on the 0.x line and may change; stay on 0.1.x until checked.
      - run: pip install "zensical~=0.1.3"
      # --strict: any warning (for example a broken link) fails the build.
      - run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job: deploy-pages in the same job as the upload can run
  # before the artifact is listed by the API and fail with "No artifacts
  # named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
